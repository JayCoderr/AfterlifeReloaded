<body>
<div id="TopBar" class="TopBar">
    <p>Afterlife Reloaded 7.0</p>
</div>

<form id="test-login-form">
    <h1 id="title-text" style="margin-top: 70px;min-height: 1em;display: inline-block;">Welcome to Afterlife Reloaded 7.0</h1>
    <hr>
    <div id="info-panel" class="info-panel">
        <img src="https://www.afterlifereloaded.com/AfterlifeReloadedRoot/Images/Jaycoder.png" alt="User Image" id="user-image">
        <p id="AIName">Jaycoder</p>    
        <p id="message-text">Welcome to Afterlife Reloaded,<br>This is an AI, that can program, generate user responses</p>
        <button id="openColorPicker"></button>
        <div id="rgbaPicker">
            <input type="range" id="r" min="0" max="255" class="slider red"><br>
            <input type="range" id="g" min="0" max="255" class="slider green"><br>
            <input type="range" id="b" min="0" max="255" class="slider blue"><br>
            <input type="range" id="a" min="0" max="1" step="0.01" class="slider alpha"><br>
        </div>       
        <p id="date-time"></p>
    </div>
    <hr>
    <input type="text" id="test-username" required placeholder="... AfterlifeUser">
    <input type="password" id="test-password" required placeholder="•••••••••••••••••••••••••••">
    <button id="login-test-button">Login</button>
	<!-- OTP Input Field -->
	<!-- QR Code Container -->
	<div id="qr-code-container">
		<img id="qr-code-img" src="" alt="QR Code" style="max-width: 150px; max-height: 150px; display: none;" />
	</div>
    <hr>
    <div id="countdown" style="margin-top: 20px; font-size: 1.5rem; text-align: center;"></div>
