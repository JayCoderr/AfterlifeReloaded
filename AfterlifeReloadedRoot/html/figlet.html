<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>

    <!-- Load figlet locally -->
    <script src="https://www.afterlifereloaded.com/AfterlifeReloadedRoot/libs/figlet.js-1.8.0/lib/figlet.js" defer></script>	
	<script src="https://www.afterlifereloaded.com/AfterlifeReloadedRoot/js/AfterlifeReloadedAsciiScripts.js" defer></script>
    <style>
        body {
            text-align: center;
            background-color: inherit;
            color: white;
            font-family: monospace;
			overflow-y: auto; 	
        }
		
		/* Hide scrollbar but keep it functional */
		body::-webkit-scrollbar {
			width: 0px; /* Hides the scrollbar */
			background: transparent; /* Ensure background is transparent */
		}
		
		body::-webkit-scrollbar-thumb {
			background: transparent; /* Ensure thumb is also invisible */
		}
		
		body:empty:before {
			content: attr(placeholder);
			color: #999;
		}		
        pre {
            font-size: 16px;
            word-wrap: break-word;
            padding: 10px;
            border: none;
            box-shadow: 0px 4px 10px rgb(0,0,0);
			min-height: calc(30px + 25px);
			overflow-x: auto;
			scrollbar-color: rgb(70,70,70) rgb(0,0,0,1);
			scrollbar-width: thin;
			background-color: rgba(0,0,0,0.8);
			text-align: left;
        }
        input, select, button {
            margin-top: 10px;
            padding: 8px;
            font-size: 16px;
            background-color: rgb(0,0,0);
            color: white;
            border: none;
            outline: none;
            box-shadow: 0px 4px 10px rgb(0,0,0);
        }
		#asciiaimessage {
			white-space: pre-line;
		}		
    </style>
</head>
<body>
    <!-- Input section -->
    <label for="wordInput">Enter Word:</label>
	<br>
    <input type="text" id="wordInput" placeholder="Type something..." /><br />
	<br>
    <label for="fontSelect">Select Font:</label>
	<br>
	<select id="fontSelect">
        <option value="Standard">Standard</option>
    </select>
	<br>
    <button id="generateBtn">Generate ASCII Art</button>

    <!-- Output section -->
    <h3 id="asciiaimessage"></h3>
    <pre id="ascii-output">Loading...</pre>	
</body>
</html>
