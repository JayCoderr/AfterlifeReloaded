<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customizable JS Obfuscator</title>
    <script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator@4.0.0/dist/index.browser.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h2, h3 {
            margin: 20px 0;
            color: #f0f0f0;
        }

        textarea {
            width: 80%;
            max-width: 800px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #f0f0f0;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 1);
            resize: vertical;
        }

        input[type="checkbox"], input[type="number"], select {
            margin-right: 10px;
        }

        label {
            color: #f0f0f0;
            display: block;
            margin-bottom: 10px;
        }

        button {
            background-color: #333;
            color: #f0f0f0;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 1);
        }

        button:hover {
            background-color: #555;
        }

        .options {
            margin-bottom: 20px;
            text-align: left;
        }

        .obfuscated-code-container {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
        }

        .obfuscated-code-container button {
            width: 100%;
        }
    </style>
</head>
<body>
    <h2>JavaScript Obfuscator</h2>

    <textarea id="inputCode" placeholder="Paste your JavaScript code here..." rows="10"></textarea>
    
    <div class="options">
        <h3>Options:</h3>
        <label><input type="checkbox" id="compact" checked> Compact (Minify code)</label>
        <label><input type="checkbox" id="controlFlowFlattening"> Control Flow Flattening</label>
        <label>Control Flow Threshold: <input type="number" id="controlFlowFlatteningThreshold" value="0.5" step="0.05" min="0" max="1"></label>
        <label><input type="checkbox" id="deadCodeInjection"> Dead Code Injection</label>
        <label>Dead Code Threshold: <input type="number" id="deadCodeInjectionThreshold" value="0.3" step="0.05" min="0" max="1"></label>
        <label><input type="checkbox" id="stringArray" checked> Transform Strings into Arrays</label>
        <label>String Array Encoding:
            <select id="stringArrayEncoding">
                <option value="none">None</option>
                <option value="rc4" selected>RC4</option>
                <option value="base64">Base64</option>
            </select>
        </label>
        <label><input type="checkbox" id="numbersToExpressions"> Convert Numbers to Expressions</label>
        <label><input type="checkbox" id="renameGlobals"> Rename Global Variables</label>
        <label><input type="checkbox" id="renameProperties"> Rename Object Properties</label>
        <label><input type="checkbox" id="transformObjectKeys"> Transform Object Keys</label>
        <label><input type="checkbox" id="rotateStringArray" checked> Rotate String Array</label>
    </div>
    
    <button onclick="obfuscateCode()">Obfuscate</button>

    <div class="obfuscated-code-container">
        <h3>Obfuscated Code:</h3>
        <textarea id="outputCode" rows="10" readonly></textarea>
        <button onclick="copyToClipboard()">Copy to Clipboard</button>
    </div>

    <script>
        function obfuscateCode() {
            let inputCode = document.getElementById("inputCode").value.trim();
            if (!inputCode) {
                alert("Please enter JavaScript code to obfuscate.");
                return;
            }

            try {
                let obfuscationOptions = {
                    compact: true,
                    controlFlowFlattening: true,
                    controlFlowFlatteningThreshold: 0.75,
                    deadCodeInjection: true,
                    deadCodeInjectionThreshold: 0.6,
                    stringArray: true,
                    stringArrayEncoding: ["rc4"],
                    stringArrayThreshold: 1,
                    rotateStringArray: true,
                    shuffleStringArray: true,
                    splitStrings: true,
                    splitStringsChunkLength: 3,
                    numbersToExpressions: true,
                    renameGlobals: true,
                    renameProperties: false,
                    transformObjectKeys: true,
                    selfDefending: false,
                    disableConsoleOutput: true,
                    unicodeEscapeSequence: true,
                    identifierNamesGenerator: "hexadecimal",
                    stringArrayWrappersType: "function",
                    stringArrayWrappersCount: 10,
                    stringArrayIndexShift: true,
                    ignoreRequireImports: true
                };     
                let obfuscationResult = JavaScriptObfuscator.obfuscate(inputCode, obfuscationOptions);
                document.getElementById("outputCode").value = obfuscationResult.getObfuscatedCode();
            } catch (error) {
                console.warn("Obfuscation Error:", error);

                try {
                    let fallbackOptions = { ...obfuscationOptions, selfDefending: false, reservedNames: [] };
                    let obfuscationResult = JavaScriptObfuscator.obfuscate(inputCode, fallbackOptions);
                    document.getElementById("outputCode").value = obfuscationResult.getObfuscatedCode();
                    alert("Obfuscation completed with adjusted settings.");
                } catch (finalError) {
                    alert("Obfuscation failed. Please check your code.");
                    console.error("Final Obfuscation Error:", finalError);
                }
            }
        }

        function copyToClipboard() {
            let outputCode = document.getElementById("outputCode");
            outputCode.select();
            document.execCommand("copy");
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
